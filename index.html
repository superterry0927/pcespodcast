<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="referrer" content="no-referrer">
  <title>SAY 哩賀！北成國小雙語PODCAST</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script crossorigin src="https://unpkg.com/react@17/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@17/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    body {
      background-color: #fceea7;
      background-image: radial-gradient(#fbcfe8 10%, transparent 11%), radial-gradient(#fbcfe8 10%, transparent 11%);
      background-size: 20px 20px;
      background-position: 0 0, 10px 10px;
      font-family: 'Helvetica Neue', Arial, 'Microsoft JhengHei', sans-serif;
    }
    .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); border-radius: 16px; box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1); border: 1px solid rgba(255, 255, 255, 0.4); }
    .pulsate-text { animation: pulsate 1.5s infinite; }
    @keyframes pulsate {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.05); opacity: 1; text-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }
      100% { transform: scale(1); opacity: 0.8; }
    }
    .custom-scrollbar::-webkit-scrollbar { width: 8px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #f1f1f1; border-radius: 10px; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
  </style>
</head>
<body>

  <div id="syntax-error-fallback" style="display:flex; justify-content:center; align-items:center; min-height:100vh; background:#fef2f2; padding:20px; font-family:sans-serif;">
    <div style="background:white; padding:40px; border-radius:12px; box-shadow:0 10px 25px rgba(0,0,0,0.1); max-width:600px; text-align:center; border-top: 5px solid #ef4444;">
      <h2 style="color:#b91c1c; font-size:24px; margin-bottom:16px; font-weight:bold;">🚨 網頁載入錯誤</h2>
      <p style="color:#4b5563; line-height:1.6; font-size:16px;">如果您看到這個畫面，代表程式碼中有語法錯誤。</p>
    </div>
  </div>

  <div id="root"></div>

  <script type="text/babel">
    document.getElementById('syntax-error-fallback').style.display = 'none';

    const firebaseConfig = {
      apiKey: "AIzaSyBa0ZMSPJUmgMnO5x0R6UfjFSrxyCYfF0I",
      authDomain: "say-hi-podcast.firebaseapp.com",
      databaseURL: "https://say-hi-podcast-default-rtdb.firebaseio.com",
      projectId: "say-hi-podcast",
      storageBucket: "say-hi-podcast.firebasestorage.app",
      messagingSenderId: "977518603086",
      appId: "1:977518603086:web:8f0017e22cf76bcaf1cc1f",
      measurementId: "G-RQYKV118YZ"
    };

    let db = null;
    let isFirebaseReady = false;

    try {
      if (!firebase.apps.length) firebase.initializeApp(firebaseConfig);
      db = firebase.database();
      isFirebaseReady = true;
    } catch (e) {
      console.error("Firebase 初始化失敗", e);
    }

    const { useState, useEffect } = React;

    function App() {
      const [isAdmin, setIsAdmin] = useState(false);
      const [showLogin, setShowLogin] = useState(false);
      const [passwordInput, setPasswordInput] = useState('');
      
      const [adminPassword, setAdminPassword] = useState('88888');
      const [rssUrl, setRssUrl] = useState('');
      const [customLogo, setCustomLogo] = useState('');
      const [formBindings, setFormBindings] = useState([]);
      
      const [podcastData, setPodcastData] = useState(null);
      const [loading, setLoading] = useState(true);
      const [errorMsg, setErrorMsg] = useState('');

      useEffect(() => {
        if (!db) return;
        const settingsRef = db.ref('settings');
        settingsRef.on('value', (snapshot) => {
          const data = snapshot.val();
          if (data) {
            if (data.adminPassword) setAdminPassword(data.adminPassword);
            if (data.rssUrl) setRssUrl(data.rssUrl);
            if (data.customLogo) setCustomLogo(data.customLogo);
            if (data.formBindings) setFormBindings(data.formBindings || []);
          }
          setLoading(false);
        }, (error) => {
          setErrorMsg('無法讀取資料庫！請確認 Firebase 控制台已建立 Realtime Database 且規則已設為 true。');
          setLoading(false);
        });
      }, []);

      useEffect(() => {
        if (rssUrl) fetchRssData(rssUrl);
      }, [rssUrl]);

      const fetchRssData = async (url) => {
        try {
          const response = await fetch(`https://api.rss2json.com/v1/api.json?rss_url=${encodeURIComponent(url)}&api_key=`);
          const data = await response.json();
          
          if (data.status === 'ok') {
            const htmlRegex = new RegExp('<[^>]+>', 'g'); // 改用安全寫法
            
            const episodes = data.items.map(item => {
              let cleanAudio = item.enclosure ? item.enclosure.link : "";
              if (cleanAudio && cleanAudio.includes("file.firstory.me")) {
                cleanAudio = "https://file.firstory.me" + cleanAudio.split("file.firstory.me")[1];
              }
              const cleanDescription = item.description.replace(htmlRegex, '');
              return {
                title: item.title,
                pubDate: item.pubDate.split(' ')[0],
                description: cleanDescription,
                audioUrl: cleanAudio
              };
            });
            
            setPodcastData({
              title: data.feed.title,
              description: data.feed.description.replace(htmlRegex, ''),
              image: customLogo || data.feed.image,
              episodes: episodes
            });
            setErrorMsg('');
          }
        } catch (err) {
          console.error(err);
        }
      };

      const handleSaveSettings = (updates, successMsg) => {
        if (!db) return;
        db.ref('settings').update(updates)
          .then(() => alert(successMsg))
          .catch(() => alert('儲存失敗！請檢查 Firebase 權限。'));
      };

      const handleLogin = () => {
        if (passwordInput === adminPassword) {
          setIsAdmin(true); setShowLogin(false); setPasswordInput('');
        } else {
          alert("密碼錯誤！");
        }
      };

      const handleLogoUpload = (e) => {
        const file = e.target.files[0];
        if (file) {
          const reader = new FileReader();
          reader.onloadend = () => {
            const newLogo = reader.result;
            setCustomLogo(newLogo);
            handleSaveSettings({ customLogo: newLogo }, 'Logo 已上傳並儲存！');
          };
          reader.readAsDataURL(file);
        }
      };

      const handleAddFormBinding = (e) => {
        e.preventDefault();
        const epTitle = e.target.epTitle.value;
        const formUrl = e.target.formUrl.value;
        if (!epTitle || !formUrl) return;
        
        const newBindings = [...formBindings, { episodeTitle: epTitle, formUrl }];
        setFormBindings(newBindings);
        handleSaveSettings({ formBindings: newBindings }, '表單綁定已儲存！');
        e.target.reset();
      };

      const removeBinding = (index) => {
        const newBindings = formBindings.filter((_, i) => i !== index);
        setFormBindings(newBindings);
        handleSaveSettings({ formBindings: newBindings }, '已刪除該綁定！');
      };

      if (loading) return <div className="min-h-screen flex items-center justify-center font-bold text-xl text-gray-600">載入雲端資料中...</div>;

      return (
        <div className="min-h-screen pb-20 relative">
          
          {!isAdmin && (
            <button onClick={() => setShowLogin(true)} className="absolute top-4 right-4 z-50 bg-white/80 hover:bg-white p-3 rounded-full shadow-md transition-all text-gray-500 hover:text-gray-800">
              <i className="fas fa-cog text-xl"></i>
            </button>
          )}

          {showLogin && (
            <div className="fixed inset-0 bg-black/50 backdrop-blur-sm flex items-center justify-center z-50">
              <div className="bg-white p-8 rounded-2xl shadow-2xl w-96 max-w-[90%] transform transition-all scale-100">
                <div className="flex justify-between items-center mb-6">
                  <h2 className="text-2xl font-bold text-gray-800">管理員登入</h2>
                  <button onClick={() => setShowLogin(false)} className="text-gray-400 hover:text-gray-600"><i className="fas fa-times text-xl"></i></button>
                </div>
                <div className="space-y-4">
                  <input 
                    type="password" 
                    className="w-full px-4 py-3 bg-gray-50 border border-gray-200 rounded-xl focus:ring-2 focus:ring-blue-400 focus:outline-none transition-all text-lg"
                    value={passwordInput}
                    onChange={(e) => setPasswordInput(e.target.value)}
                    onKeyPress={(e) => e.key === 'Enter' && handleLogin()}
                  />
                  <button onClick={handleLogin} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition-all shadow-md hover:shadow-lg">進入後台</button>
                </div>
              </div>
            </div>
          )}

          {isAdmin ? (
            <div className="max-w-4xl mx-auto pt-10 px-4 space-y-6">
              <div className="flex justify-between items-center mb-8">
                <h1 className="text-3xl font-bold text-gray-800"><i className="fas fa-cloud text-blue-500 mr-3"></i>雲端管理後台</h1>
                <button onClick={() => setIsAdmin(false)} className="bg-gray-200 hover:bg-gray-300 px-5 py-2 rounded-lg font-bold text-gray-700 transition-all"><i className="fas fa-sign-out-alt mr-2"></i>返回前台</button>
              </div>

              <div className="glass-card p-6">
                <h2 className="text-xl font-bold text-gray-800 mb-4"><i className="fas fa-satellite-dish mr-2 text-purple-500"></i>Podcast RSS 來源</h2>
                <div className="flex flex-col md:flex-row gap-4">
                  <input type="text" value={rssUrl} onChange={(e) => setRssUrl(e.target.value)} placeholder="貼上 Firstory RSS 網址..." className="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400" />
                  <button onClick={() => handleSaveSettings({ rssUrl }, 'RSS 已儲存！')} className="bg-blue-600 text-white px-6 py-2 rounded-lg font-bold hover:bg-blue-700">儲存</button>
                </div>
              </div>

              <div className="glass-card p-6">
                <h2 className="text-xl font-bold text-gray-800 mb-4"><i className="fas fa-lock mr-2 text-orange-500"></i>管理後台密碼設定</h2>
                <div className="flex flex-col md:flex-row gap-4">
                  <input type="text" value={adminPassword} onChange={(e) => setAdminPassword(e.target.value)} placeholder="輸入新密碼" className="flex-1 px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-400" />
                  <button onClick={() => handleSaveSettings({ adminPassword }, '新密碼已儲存！')} className="bg-orange-500 text-white px-6 py-2 rounded-lg font-bold hover:bg-orange-600">更新密碼</button>
                </div>
              </div>

              <div className="glass-card p-6">
                <h2 className="text-xl font-bold text-gray-800 mb-4"><i className="fas fa-image mr-2 text-green-500"></i>自訂節目 LOGO</h2>
                <input type="file" accept="image/*" onChange={handleLogoUpload} className="w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:font-bold file:bg-green-50 file:text-green-700 hover:file:bg-green-100"/>
              </div>

              <div className="glass-card p-6">
                <h2 className="text-xl font-bold text-gray-800 mb-4"><i className="fas fa-tasks mr-2 text-red-500"></i>為單集綁定 Google 表單</h2>
                <form onSubmit={handleAddFormBinding} className="bg-gray-50 p-4 rounded-xl border border-gray-200 mb-4">
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">選擇單集</label>
                      <select name="epTitle" className="w-full px-3 py-2 border rounded-lg" required>
                        <option value="">-- 請選擇 --</option>
                        {podcastData?.episodes.map((ep, i) => (
                          <option key={i} value={ep.title}>{ep.title}</option>
                        ))}
                      </select>
                    </div>
                    <div>
                      <label className="block text-sm font-bold text-gray-700 mb-1">表單網址 (https://...)</label>
                      <input type="url" name="formUrl" className="w-full px-3 py-2 border rounded-lg" required />
                    </div>
                  </div>
                  <button type="submit" className="mt-4 w-full bg-red-500 text-white font-bold py-2 rounded-lg hover:bg-red-600">新增綁定</button>
                </form>

                <div className="space-y-2">
                  {formBindings.map((binding, index) => (
                    <div key={index} className="flex justify-between items-center bg-white border p-3 rounded-lg shadow-sm">
                      <div className="overflow-hidden pr-4">
                        <div className="font-bold text-gray-800 truncate">{binding.episodeTitle}</div>
                        <div className="text-xs text-blue-500 truncate">{binding.formUrl}</div>
                      </div>
                      <button onClick={() => removeBinding(index)} className="text-red-500 hover:text-red-700 p-2"><i className="fas fa-trash"></i></button>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          ) : (
            <div className="max-w-3xl mx-auto pt-10 px-4 md:pt-16">
              
              {podcastData ? (
                <div className="text-center mb-12 animate-fade-in-up">
                  <img src={podcastData.image} alt="Logo" className="w-32 h-32 md:w-56 md:h-56 mx-auto rounded-3xl shadow-xl border-4 border-white mb-6 object-cover bg-white"/>
                  <h1 className="text-2xl md:text-5xl font-extrabold text-gray-800 mb-4">{podcastData.title}</h1>
                  <p className="text-gray-700 text-sm md:text-base px-4 leading-relaxed max-w-2xl mx-auto">{podcastData.description}</p>
                </div>
              ) : (
                <div className="text-center mt-20">
                  <h1 className="text-2xl md:text-3xl font-extrabold text-gray-800 mb-4">SAY 哩賀！北成國小雙語PODCAST</h1>
                  <p className="text-gray-500">目前沒有節目資料，請由右上角登入後台設定。</p>
                  <p className="text-red-500 mt-4 font-bold">{errorMsg}</p>
                </div>
              )}

              <div className="space-y-8">
                {podcastData?.episodes.map((ep, index) => {
                  const epNumber = podcastData.episodes.length - index;
                  const boundForm = formBindings.find(b => b.episodeTitle === ep.title);

                  return (
                    <div key={index} className="relative pt-6 animate-fade-in-up">
                      <div className="absolute top-0 left-4 bg-yellow-400 text-gray-900 font-black px-4 py-1.5 rounded-t-xl text-sm shadow-sm z-10">EP. {epNumber}</div>
                      
                      <div className="glass-card p-5 md:p-8 relative z-20">
                        <h2 className="text-lg md:text-2xl font-bold text-gray-800 mb-2 leading-tight">{ep.title}</h2>
                        <div className="text-blue-500 text-xs md:text-sm font-semibold mb-4"><i className="far fa-calendar-alt mr-2"></i>{ep.pubDate}</div>
                        <p className="text-gray-600 text-sm md:text-base leading-relaxed mb-6 custom-scrollbar max-h-32 overflow-y-auto pr-2">{ep.description}</p>
                        
                        <div className="bg-gray-100 p-3 md:p-4 rounded-2xl shadow-inner mb-2">
                          <audio controls src={ep.audioUrl} preload="metadata" className="w-full h-12 outline-none rounded-full">不支援音訊播放。</audio>
                        </div>
                        <div className="text-right mb-6">
                            <a href={ep.audioUrl} target="_blank" rel="noopener noreferrer" className="text-xs text-blue-500 hover:text-blue-700 underline font-semibold"><i className="fas fa-external-link-alt mr-1"></i> 播放器沒反應？點此另開視窗收聽</a>
                        </div>

                        {boundForm && (
                          <div className="mt-4 border-t border-dashed border-gray-300 pt-6">
                            <div className="bg-green-50 rounded-2xl p-5 border border-green-100 flex flex-col items-center">
                              <div className="bg-red-100 text-red-600 text-sm font-bold px-4 py-1.5 rounded-full mb-4 pulsate-text shadow-sm">🎤 上傳錄音，參加活動</div>
                              <div className="bg-green-500 text-white text-sm font-bold px-6 py-2 rounded-full mb-6 shadow-md">📝 EP{epNumber.toString().padStart(2, '0')} 填報表單</div>
                              <div className="bg-white p-3 rounded-xl shadow-sm border border-gray-100 mb-6">
                                <img src={`https://api.qrserver.com/v1/create-qr-code/?size=180x180&data=${encodeURIComponent(boundForm.formUrl)}`} alt="QR" className="w-32 h-32 md:w-40 md:h-40 object-contain"/>
                              </div>
                              <a href={boundForm.formUrl} target="_blank" rel="noopener noreferrer" className="w-full max-w-xs bg-green-500 hover:bg-green-600 text-white font-bold py-3.5 px-6 rounded-xl text-center shadow-md flex items-center justify-center">
                                前往表單填寫 <i className="fas fa-arrow-right ml-2"></i>
                              </a>
                            </div>
                          </div>
                        )}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
          )}
        </div>
      );
    }

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
